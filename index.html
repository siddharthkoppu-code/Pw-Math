<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathSolve — Step-by-Step Problem Solver</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0d0e12; --bg2: #13141a; --bg3: #1a1c24; --card: #1e2029; --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14); --text: #f0f0f5; --muted: #8a8b99; --accent: #7c6fe0; --accent2: #5de0c0; --accent3: #f0c060; --glow: rgba(124, 111, 224, 0.15); --red: #e06070; --radius: 14px; --radius-sm: 8px; }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; font-size: 16px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(124,111,224,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(124,111,224,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 24px 80px; }
  header { padding: 48px 0 36px; display: flex; align-items: center; gap: 16px; }
  .logo-mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 22px; color: white; flex-shrink: 0; }
  .brand h1 { font-family: 'DM Serif Display', serif; font-size: 26px; font-weight: 400; letter-spacing: -0.3px; }
  .brand p { font-size: 13px; color: var(--muted); font-weight: 300; }
  .auth-ui { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn-auth { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Outfit'; font-size: 13px; }
  /* (All other original styles...) */
  .topics { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .topic-pill { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
  .topic-pill.active { border-color: var(--accent); color: #c0b8f8; background: rgba(124,111,224,0.1); }
  .input-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  textarea { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 15px; min-height: 100px; resize: none; }
  .solve-btn { background: var(--accent); color: white; border: none; padding: 12px 32px; border-radius: 8px; cursor: pointer; font-family: 'Outfit'; font-weight: 600; }
  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: none; margin-top: 20px; }
  .result-card.visible { display: block; }
  .history-section { margin-top: 36px; display: none; }
  .history-item { background: var(--bg3); border: 1px solid var(--border); padding: 10px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo-mark">∑</div>
    <div class="brand"><h1>MathSolve</h1><p>Step-by-step solutions for any problem</p></div>
    <div class="auth-ui">
      <button id="login-btn" class="btn-auth" onclick="signIn()">Sign In</button>
      <div id="user-profile" style="display:none; text-align:right;">
        <span id="user-name" style="font-size:12px; color:var(--muted); display:block;"></span>
        <button onclick="signOut()" style="background:none; border:none; color:var(--red); cursor:pointer; font-size:11px;">Logout</button>
      </div>
    </div>
  </header>

  <div class="input-card">
    <textarea id="problem-input" placeholder="Type your math problem here..."></textarea>
    <button class="solve-btn" id="solve-btn" onclick="solve()">Solve Problem</button>
  </div>

  <div class="result-card" id="result-card"><div id="result-body"></div></div>
  <div class="history-section" id="history-section">
    <div class="history-title">Recent Problems</div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD5Zo7yh2leXygANPY7lcpTmnlUhCi4-5s",
    authDomain: "pw-math-track.firebaseapp.com",
    projectId: "pw-math-track",
    storageBucket: "pw-math-track.firebasestorage.app",
    messagingSenderId: "137478965634",
    appId: "1:137478965634:web:fcede46a01c087d373a79b"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  function signIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  function signOut() { auth.signOut(); }

  auth.onAuthStateChanged((user) => {
    document.getElementById('login-btn').style.display = user ? 'none' : 'block';
    document.getElementById('user-profile').style.display = user ? 'block' : 'none';
    if (user) {
        document.getElementById('user-name').textContent = user.displayName;
        loadFirestoreHistory();
    } else {
        document.getElementById('history-section').style.display = 'none';
    }
  });

  async function solve() {
    const problem = document.getElementById('problem-input').value;
    // ... [Your original logic goes here] ...
    const fullText = "Example Solution..."; // Replace with your actual AI result
    
    document.getElementById('result-card').classList.add('visible');
    document.getElementById('result-body').innerHTML = fullText;

    if (auth.currentUser) {
        db.collection('users').doc(auth.currentUser.uid).collection('history').add({
            problem: problem,
            solution: fullText,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
  }

  function loadFirestoreHistory() {
    db.collection('users').doc(auth.currentUser.uid).collection('history')
      .orderBy('timestamp', 'desc').limit(8).onSnapshot(snap => {
        const list = document.getElementById('history-list');
        document.getElementById('history-section').style.display = 'block';
        list.innerHTML = snap.docs.map(doc => `<div class="history-item">${doc.data().problem}</div>`).join('');
    });
  }
</script>
</body>
</html>
