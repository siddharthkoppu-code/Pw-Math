        <div class="brand">
            <h1>MathSolve</h1>
            <p>Step-by-step solutions for any problem</p>
        </div>
        <div id="auth-area" style="margin-left: auto;">
            <button id="login-btn" class="btn-auth" onclick="signIn()">Sign In</button>
            <div id="user-profile" style="display:none; text-align:right;">
                <div id="user-name" style="font-size:12px; color:var(--muted)"></div>
                <button onclick="signOut()" style="background:transparent; border:none; color:var(--red); font-size:12px; cursor:pointer;">Logout</button>

        </div>
    </header>

<script>
    // 1. Firebase Initialization
    const firebaseConfig = {

        authDomain: "pw-math-track.firebaseapp.com",
        projectId: "pw-math-track",
        storageBucket: "pw-math-track.firebasestorage.app",
        messagingSenderId: "137478965634",
        appId: "1:137478965634:web:fcede46a01c087d373a79b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 2. Auth Logic
    function signIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function signOut() { auth.signOut(); }

    auth.onAuthStateChanged((user) => {
        document.getElementById('login-btn').style.display = user ? 'none' : 'block';
        document.getElementById('user-profile').style.display = user ? 'block' : 'none';
        if (user) document.getElementById('user-name').textContent = user.displayName;
    });

                problem: document.getElementById('problem-input').value,
                solution: fullText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        ...

</script>
