<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathSolve — Step-by-Step Problem Solver</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
    
    <style>
        /* (KEEP YOUR EXISTING CSS HERE - OMITTED FOR BREVITY) */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0d0e12; --bg2: #13141a; --bg3: #1a1c24; --card: #1e2029; --border: rgba(255,255,255,0.08); --text: #f0f0f5; --muted: #8a8b99; --accent: #7c6fe0; --accent2: #5de0c0; --red: #e06070; --radius: 14px; --radius-sm: 8px; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; padding: 20px; }
        .wrapper { max-width: 860px; margin: 0 auto; }
        header { padding: 48px 0 36px; display: flex; align-items: center; gap: 16px; }
        .logo-mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 22px; color: white; }
        .brand h1 { font-family: 'DM Serif Display', serif; font-size: 26px; }
        .btn-auth { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Outfit'; }
    </style>
</head>
<body>
<div class="wrapper">
    <header>
        <div class="logo-mark">∑</div>
        <div class="brand">
            <h1>MathSolve</h1>
        </div>
        <div id="auth-area" style="margin-left: auto;">
            <button id="login-btn" class="btn-auth" onclick="signIn()">Sign In with Google</button>
            <div id="user-profile" style="display:none; align-items:center; gap:10px;">
                <span id="user-name" style="color:var(--muted); font-size:14px;"></span>
                <button onclick="signOut()" class="btn-auth" style="background:var(--red);">Logout</button>
            </div>
        </div>
    </header>

    <div id="result-card" class="result-card"><div id="result-body"></div></div>
    <div class="history-section" id="history-section"><div class="history-list" id="history-list"></div></div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyD5Zo7yh2leXygANPY7lcpTmnlUhCi4-5s",
        authDomain: "pw-math-track.firebaseapp.com",
        projectId: "pw-math-track",
        storageBucket: "pw-math-track.firebasestorage.app",
        messagingSenderId: "137478965634",
        appId: "1:137478965634:web:fcede46a01c087d373a79b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Authentication Functions
    function signIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(console.error);
    }

    function signOut() { auth.signOut(); }

    auth.onAuthStateChanged((user) => {
        const loginBtn = document.getElementById('login-btn');
        const profile = document.getElementById('user-profile');
        if (user) {
            loginBtn.style.display = 'none';
            profile.style.display = 'flex';
            document.getElementById('user-name').textContent = user.displayName;
            loadUserHistory();
        } else {
            loginBtn.style.display = 'block';
            profile.style.display = 'none';
            document.getElementById('history-list').innerHTML = '';
        }
    });

    // Firestore Functions
    async function saveToHistory(problem, solution) {
        if (auth.currentUser) {
            await db.collection('users').doc(auth.currentUser.uid).collection('history').add({
                problem: problem,
                solution: solution,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }

    function loadUserHistory() {
        db.collection('users').doc(auth.currentUser.uid).collection('history')
            .orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `<div class="history-item"><strong>${data.problem}</strong></div>`;
                });
            });
    }

    // Call saveToHistory() inside your existing solve() function 
    // immediately after you get the fullText response.
</script>
</body>
</html>
